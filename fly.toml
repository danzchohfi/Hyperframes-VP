# Fly.io config. Deploy with:
#   fly launch --no-deploy            (skip first deploy so you can set env)
#   fly secrets set OPENAI_API_KEY=sk-...
#   fly secrets set HFVP_AUTH_PASSWORD=alguma-senha-forte
#   fly volumes create hfvp_data --size 10  # 10 GB persistent disk
#   fly deploy
#
# The volume is mounted at /data so projects survive deploys.

app = "hyperframes-vp"
primary_region = "gru"   # São Paulo; troque pra "mia", "iad" etc se precisar

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8765"
  HFVP_PROJECTS_DIR = "/data/projects"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

[mounts]
  source = "hfvp_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
