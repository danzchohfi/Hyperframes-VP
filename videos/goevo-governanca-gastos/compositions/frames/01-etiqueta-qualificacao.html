  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Macro camera push — slow scale running under the whole shot
      tl.fromTo("#f01-zoom", { scale: 1 }, { scale: 1.022, duration: 4.949, ease: "none" }, 0);

      // Scene 1 (0.0–0.8s) — etiqueta slides down from above with a long settle;
      // accent-line draws underneath (scaleX from left); dot-grid atmosphere fades in
      tl.fromTo(
        "#f01-tag",
        { y: -140, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: "expo.out" },
        0.05
      );
      tl.fromTo(

        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.out" },
        0.4
      );
      tl.fromTo(
        "#f01-dots",
        { opacity: 0 },
        { opacity: 1, duration: 0.8, ease: "power2.out" },
        0.35
      );

      // Scene 2 (0.8–2.0s) — per-word staggered reveal of the cover question.
      // Word starts pre-computed ONCE from content length (dynamic-content-sequencing
      // reduction: dur = BASE + chars * SEC_PER_CHAR) — longer words earn more window.
      var words = gsap.utils.toArray(".f01-w");
      var BASE = 0.05;
      var SEC_PER_CHAR = 0.014;
      var cum = 0.85;
      var starts = words.map(function (el) {
        var s = cum;
        cum += BASE + el.textContent.length * SEC_PER_CHAR;
        return s;
      });
      words.forEach(function (el, i) {
        tl.fromTo(
          el,
          { y: 36, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          starts[i]
        );
      });

      // Underline sweep on "governa?" the instant it settles
      // (css-marker-patterns highlight mechanics: scaleX 0 -> 1, left origin)
      var HL_AT = starts[starts.length - 1] + 0.5;
      tl.fromTo(
        "#f01-hl",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        HL_AT
      );

      // Scene 3 (2.0–4.1s) — the three qualification pills settle one by one on
      // voice cues (spring-pop-entrance, smooth register: power3.out, no overshoot)
      var PILL_AT = [2.1, 2.8, 3.5];
      ["#f01-pill-1", "#f01-pill-2", "#f01-pill-3"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          PILL_AT[i]

          sel + " .f01-check",
          { scale: 0 },
          { scale: 1, duration: 0.4, ease: "power3.out" },
          PILL_AT[i] + 0.1

      // (sine-wave-loop at low amplitude, authored as two finite tweens — no repeat)
      tl.to("#f01-tag", { y: -3, duration: 0.35, ease: "sine.inOut" }, 4.2);
      tl.to("#f01-tag", { y: 0, duration: 0.35, ease: "sine.inOut" }, 4.55);

      window.__timelines["01-etiqueta-qualificacao"] = tl;
    })();
