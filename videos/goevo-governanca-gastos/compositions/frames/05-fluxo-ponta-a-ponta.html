  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var DUR = 9.216;

      // ---- virtual camera (viewport-change): one cam object, one writer ----
      var world = document.getElementById("f05-world");
      var cam = { x: 0, scale: 1 };
      function applyCamera() {
        world.style.transform =
          "translate(" + cam.x + "px, 0px) scale(" + cam.scale + ")";
      }
      applyCamera(); // seed frame 0 — camera opens on station 1

      // Station i (0-indexed) world center = 540 + i*720 → cam.x = -i*720.
      var STEP = 720;

      // ---- Scene 2 (1.2–6.9s): sequenced pans, ~0.81s per station ----
      var PAN_T = [];
      for (var k = 0; k < 7; k++) PAN_T.push(1.2 + k * 0.8143);
      PAN_T.forEach(function (t, i) {
        tl.to(
          cam,
          { x: -STEP * (i + 1), duration: 0.55, ease: "power2.inOut", onUpdate: applyCamera },
          t
        );
      });

      // ---- Scene 3 (6.9s): final pan to the terminal (center x=6300) ----
      tl.to(
        cam,
        { x: -5760, duration: 0.75, ease: "power3.inOut", onUpdate: applyCamera },
        6.9
      );
      // camera locks, then a subtle push-in on the punchline.
      // Single-wrapper camera: T = -offset × S → x follows -5760 × 1.025.
      tl.to(
        cam,
        { x: -5904, scale: 1.025, duration: 0.86, ease: "sine.inOut", onUpdate: applyCamera },
        8.35
      );

      // ---- process wire (svg-path-draw): measured length, extends ahead ----
      var wire = document.getElementById("f05-wirepath");
      var wlen = wire.getTotalLength();
      wire.style.strokeDasharray = String(wlen);
      wire.style.strokeDashoffset = String(wlen);
      function offAt(x) {
        return wlen - (x - 120);
      }
      var WIRE_SEGS = [
        [0.15, 1440, 0.6], // Scene 1: draws ahead of station 1
        [1.2, 2160, 0.5],
        [2.014, 2880, 0.5],
        [2.829, 3600, 0.5],
        [3.643, 4320, 0.5],
        [4.457, 5040, 0.5],
        [5.272, 5760, 0.5],
        [6.086, 6100, 0.5],
        [6.9, 6260, 0.6] // the line closes into the terminal callout
      ];
      WIRE_SEGS.forEach(function (s) {
        tl.to(wire, { strokeDashoffset: offAt(s[1]), duration: s[2], ease: "power2.out" }, s[0]);
      });

      // ---- station arrivals: node → callout spring-pop → step → typed label ----
      var LABELS = [
        "REQUISIÇÕES",
        "COTAÇÕES",
        "APROVAÇÕES",
        "PEDIDOS",
        "CONTRATOS",
        "FORNECEDORES",
        "RECEBIMENTOS",
        "NOTAS FISCAIS"
      ];
      function typeLabel(el, text, at, d) {
        var p = { v: 0 };
        tl.to(
          p,
          {
            v: text.length,
            duration: d,
            ease: "power1.inOut",
            onUpdate: function () {
              el.textContent = text.substring(0, Math.floor(p.v));
            }
          },
          at
        );
      }
      LABELS.forEach(function (text, i) {
        var n = i + 1;
        // Scene 1 opens on station 1 (hero visible well before 0.5s);
        // stations 2..8 pop as the pan brings them into frame.
        var nodeAt = i === 0 ? 0.1 : PAN_T[i - 1] + 0.26;
        var cardAt = i === 0 ? 0.2 : PAN_T[i - 1] + 0.34;
        var stepAt = i === 0 ? 0.34 : PAN_T[i - 1] + 0.42;
        var labelAt = i === 0 ? 0.5 : PAN_T[i - 1] + 0.45;
        tl.fromTo(
          "#f05-node-" + n,
          { scale: 0 },
          { scale: 1, duration: 0.35, ease: "power3.out" },
          nodeAt
        );
        tl.fromTo(
          "#f05-card-" + n,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: i === 0 ? 0.55 : 0.5, ease: "power3.out" },
          cardAt
        );
        tl.fromTo(
          "#f05-step-" + n,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
          stepAt
        );
        typeLabel(
          document.getElementById("f05-label-" + n),
          text,
          labelAt,
          i === 0 ? 0.34 : 0.32
        );
      });

      // ---- screen-fixed chrome ----
      tl.fromTo(
        "#f05-eyebrow",
        { y: -42, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" },
        0.05
      );
      tl.fromTo(
        "#f05-accent",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        0.35
      );
      tl.fromTo(
        "#f05-counter",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        0.55
      );

      // station counter — discrete-text-sequence (state snaps at pan landings)
      var counterEl = document.getElementById("f05-counter");
      var CSEQ = [
        [0, "01 / 08"],
        [1.75, "02 / 08"],
        [2.56, "03 / 08"],
        [3.38, "04 / 08"],
        [4.19, "05 / 08"],
        [5.01, "06 / 08"],
        [5.82, "07 / 08"],
        [6.64, "08 / 08"]
      ];
      var cd = { t: 0 };
      tl.to(
        cd,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            for (var j = CSEQ.length - 1; j >= 0; j--) {
              if (cd.t >= CSEQ[j][0]) {
                counterEl.textContent = CSEQ[j][1];
                return;
              }
            }
          }
        },
        0
      );

      // ---- Scene 3: terminal punchline pops centered; eight dots condense ----
      tl.fromTo(
        "#f05-terminal",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        7.3
      );
      tl.fromTo(
        "#f05-taccent",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        7.8
      );
      tl.fromTo(
        "#f05-miniline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.out" },
        7.95
      );
      gsap.utils.toArray(".f05-minidot").forEach(function (el, i) {
        tl.fromTo(
          el,
          { scale: 0, opacity: 0, x: (i - 3.5) * 30 },
          { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
          7.95 + i * 0.055
        );
      });

      window.__timelines["05-fluxo-ponta-a-ponta"] = tl;
    })();
  </script>
