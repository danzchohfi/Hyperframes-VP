    <script src="vendor/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines["07-budget-aprovacao"] = tl;

        var EASE = "power3.out";

        /* ============ Scene 1 (0.0–2.2s) — header settles, chips pop ============ */
        tl.fromTo(
          "#f07-accent",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: EASE },
          0.1
        );
        tl.fromTo(
          "#f07-eyebrow",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.55, ease: EASE },
          0.18
        );
        tl.fromTo(
          "#f07-h3",
          { opacity: 0, y: 32 },
          { opacity: 1, y: 0, duration: 0.6, ease: EASE },
          0.3
        );

        // dashboard mock already frames the middle third, still empty
        tl.fromTo(
          "#f07-mock",
          { opacity: 0, y: 70, scale: 0.985 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: EASE },
          0.55
        );
        tl.fromTo(
          "#f07-mock-head",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: EASE },
          0.85
        );

        // ERP chips — spring-pop-entrance (smooth settle, staggered group = one beat)
        gsap.utils.toArray(".f07-chip").forEach(function (el, i) {
          tl.fromTo(
            el,
            { scale: 0, opacity: 0, y: 16 },
            { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: EASE },
            1.3 + i * 0.08
          );
        });

        /* ============ Scene 2 (2.2–3.9s) — rules card ============ */
        tl.fromTo(
          "#f07-rules",
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.55, ease: EASE },
          2.3
        );

        // dynamic-content-sequencing — row starts computed from content length,
        // reduced once at build (no hardcoded per-item offsets), scaled to the window
        var RULE_ROWS = gsap.utils.toArray(".f07-rule-row");
        var RULE_CONTENT = [
          { label: "Alçadas por valor" },
          { label: "Centro de custo" },
          { label: "Projeto" }
        ];
        var BASE_DURATION = 0.34;
        var SEC_PER_CHAR = 0.011;
        var cumulative = 0;
        var RULE_TIMELINE = RULE_CONTENT.map(function (entry) {
          var dur = BASE_DURATION + entry.label.length * SEC_PER_CHAR;
          var start = cumulative;
          cumulative += dur;
          return { label: entry.label, start: start };
        });
        var RULES_AT = 2.52;
        var RULES_SPAN = 1.3;
        var scaleK = RULES_SPAN / cumulative;

        RULE_ROWS.forEach(function (row, i) {
          var at = RULES_AT + RULE_TIMELINE[i].start * scaleK;
          tl.fromTo(
            row,
            { opacity: 0, x: -28 },
            { opacity: 1, x: 0, duration: 0.45, ease: EASE },
            at
          );
          // toggle flips on — knob slides, track tints cobalt
          var knob = row.querySelector(".f07-knob");
          var track = row.querySelector(".f07-toggle");
          tl.fromTo(
            knob,
            { x: 0 },
            { x: 26, duration: 0.32, ease: "power2.out" },
            at + 0.16
          );
          tl.fromTo(
            track,
            { backgroundColor: "rgba(0, 153, 255, 0.15)" },
            { backgroundColor: "#0099ff", duration: 0.32, ease: "power2.out" },
            at + 0.16
          );
        });

        /* ==== Scene 3 (3.9–7.4s) — counting-dynamic-scale + stat-bars-and-fills ==== */
        // Signature move: numeral counts up + scale grows + bar fills on the SAME ease,
        // triplicated across the three meters, each on its own word cue.
        var COUNT_DUR = 1.3;
        var METRICS = [
          {
            at: 3.95,
            card: "#f07-metric-1",
            wrap: "#f07-wrap-1",
            num: "f07-num-1",
            suffix: "#f07-suffix-1",
            bar: "#f07-bar-1",
            target: 1.2,
            pct: 1.0,
            fmt: function (v) {
              return v.toFixed(2).replace(".", ",");
            }
          },
          {
            at: 4.8,
            card: "#f07-metric-2",
            wrap: "#f07-wrap-2",
            num: "f07-num-2",
            suffix: "#f07-suffix-2",
            bar: "#f07-bar-2",
            target: 780,
            pct: 0.65,
            fmt: function (v) {
              return String(Math.round(v));
            }
          },
          {
            at: 5.65,
            card: "#f07-metric-3",
            wrap: "#f07-wrap-3",
            num: "f07-num-3",
            suffix: "#f07-suffix-3",
            bar: "#f07-bar-3",
            target: 460,
            pct: 0.38,
            fmt: function (v) {
              return String(Math.round(v));
            }
          }
        ];

        METRICS.forEach(function (m) {
          var numEl = document.getElementById(m.num);
          var state = { value: 0 };
          var countAt = m.at + 0.18;

          // card pops in on its word cue
          tl.fromTo(
            m.card,
            { opacity: 0, y: 56, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: EASE },
            m.at
          );

          // count value — onUpdate writes text only (O(1))
          tl.to(
            state,
            {
              value: m.target,
              duration: COUNT_DUR,
              ease: EASE,
              onUpdate: function () {
                numEl.textContent = m.fmt(state.value);
              }
            },
            countAt
          );

          // visual growth — same position, same ease as the count
          tl.fromTo(
            m.wrap,
            { scale: 0.6 },
            { scale: 1, duration: COUNT_DUR, ease: EASE },
            countAt
          );

          // bar fill — same position, same ease, same duration (one chord)
          tl.fromTo(
            m.bar,
            { scaleX: 0 },
            { scaleX: m.pct, duration: COUNT_DUR, ease: EASE },
            countAt
          );

          // suffix slides in AFTER the count lands — the number gets its own beat
          tl.fromTo(
            m.suffix,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.7)" },
            countAt + COUNT_DUR
          );
        });

        /* ===== Scene 4 (7.4–10.261s) — approval slides up, flips to approved ===== */
        tl.fromTo(
          "#f07-approval",
          { opacity: 0, y: 110, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: EASE },
          7.55
        );
        tl.fromTo(
          "#f07-btn",
          { scale: 0.5, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: EASE },
          7.95
        );

        // press → release, the flip lands on the release
        tl.to("#f07-btn", { scale: 0.93, duration: 0.14, ease: "power2.in" }, 8.86);
        tl.to("#f07-btn", { scale: 1, duration: 0.4, ease: EASE }, 9.0);

        // discrete-text-sequence — whole-state swap at a threshold, instant, seek-safe
        var btnEl = document.getElementById("f07-btn");
        var BTN_SEQ = [
          { t: 0.0, s: 0 }, // "Aprovar" (pending)
          { t: 1.62, s: 1 } // "Aprovado ✓" (approved) — abs 9.02s
        ];
        var SEQ_DUR = 2.861; // 7.4 → 10.261
        var driver = { t: 0 };
        var lastState = -1;
        tl.to(
          driver,
          {
            t: SEQ_DUR,
            duration: SEQ_DUR,
            ease: "none",
            onUpdate: function () {
              var s = 0;
              for (var i = BTN_SEQ.length - 1; i >= 0; i--) {
                if (driver.t >= BTN_SEQ[i].t) {
                  s = BTN_SEQ[i].s;
                  break;
                }
              }
              if (s !== lastState) {
                lastState = s;
                if (s === 1) {
                  btnEl.textContent = "Aprovado ✓";
                  btnEl.classList.add("f07-approved");
                } else {
                  btnEl.textContent = "Aprovar";
                  btnEl.classList.remove("f07-approved");
                }
              }
            }
          },
          7.4
        );
        // hold on the complete dashboard through 10.261s — no exit (non-final frame)
      })();
    </script>
