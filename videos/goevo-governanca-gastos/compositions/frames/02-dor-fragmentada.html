        "#f02-sheet",
        { scale: 0, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.9
      );

      // low-amplitude float (sine-wave-loop, authored as finite sequential tweens —
      // no repeat/yoyo; staggered periods; every float lands at y:0 before the morph)
      var FLOATS = [
        ["#f02-mail", 3, 0.85, 0.8],
        ["#f02-wa", 3, 1.25, 0.72],
        ["#f02-sheet", 3, 1.6, 0.66]
      ];
      FLOATS.forEach(function (f) {
        for (var j = 0; j < 4; j++) {
          tl.to(
            f[0],
            { y: j % 2 === 0 ? -f[1] : 0, duration: f[3], ease: "sine.inOut" },
            f[2] + j * f[3]
          );
        }
      });

      // ============ Scene 2 (2.0–4.1s) — proposals scatter, density rises (3 layers) ============
      var CARDS = [
        ["#f02-c1", 2.05, -5, 1, 1],
        ["#f02-c2", 2.25, 7, 0.92, 0.95],
        ["#f02-c3", 2.45, 4, 0.92, 0.95],
        ["#f02-c4", 2.65, -8, 0.84, 0.9],
        ["#f02-c6", 2.85, -10, 0.84, 0.9],
        ["#f02-c5", 3.1, -3, 1, 1]
      ];
      CARDS.forEach(function (c) {
        tl.fromTo(
          c[0],
          { scale: 0, opacity: 0, rotation: c[2] },
          { scale: c[3], opacity: c[4], rotation: c[2], duration: 0.55, ease: "power3.out" },
          c[1]
        );
      });

      // ============ Scene 3 (4.1–6.8s) — signature move: card-morph-anchor ============
      // old content fades during the first ~40% of the morph
      tl.to("#f02-mail-inner", { opacity: 0, duration: 0.36, ease: "power1.in" }, 4.3);

      // one tween, all channels: scaleX/scaleY reshape + paint-only surface change
      // (600x440 mail -> 640x380 financeiro card; shared center, so scale about 50/50)

        "#f02-mail",
        {
          scaleX: 1.068,
          scaleY: 0.864,
          backgroundColor: "rgba(0, 153, 255, 0.04)",
          borderColor: "rgba(0, 153, 255, 0.2)",
          borderRadius: "15px",

          ease: "power2.inOut"

        var depth = Number(el.dataset.depth) || 1;
        tl.to(
          el,
          {
            "--dof": 3 + depth * 2 + "px",
            opacity: [0.6, 0.5, 0.42][depth - 1],
            duration: 0.85,
            ease: "power2.inOut"

          4.35
        );
      });

      // handoff — morph card fades out over the pixel-matched anchor behind it
      tl.to(
        "#f02-mail",
        { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false },
        5.05

      tl.fromTo(
        "#f02-fin",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false },

        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
